spring:
  application:
    name: account-service
  config:
    import: "optional:nacos:${spring.application.name}.yml?group=PIGGYMETRICS,optional:nacos:application-common.yml?group=PIGGYMETRICS"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
  data:
    mongodb:
      host: ${MONGO_HOST:account-mongodb}
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017
  # MIGRATION: security.oauth2.client.* (retired) -> spring.security.oauth2.client.*
  # Same clientId/secret/tokenUri/grant/scope as the legacy shared/account-service.yml.
  security:
    oauth2:
      client:
        registration:
          account-service:
            client-id: account-service
            client-secret: ${ACCOUNT_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server
            provider: piggymetrics
        provider:
          piggymetrics:
            token-uri: http://auth-service:5000/uaa/oauth2/token
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:5000/uaa

server:
  servlet:
    context-path: /accounts
  port: 6000

piggymetrics:
  feign:
    client-registration-id: account-service

feign:
  sentinel:
    enabled: true   # was: feign.hystrix.enabled=true -> Sentinel circuit breaking (M5)

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# ---- Distributed tracing export (方案B Jaeger / 方案C SkyWalking 通用) ----
# brave(Zipkin wire format) 上报；endpoint 由环境变量注入：
#   联调/开发: Jaeger  all-in-one  -> http://jaeger:9414/api/v2/spans (Zipkin 兼容端口)
#   生产(金融): SkyWalking OAP     -> 见 production 文档(建议 javaagent 无侵入方式)
management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://jaeger:9414/api/v2/spans}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
