server:
  port: 7000
  servlet:
    context-path: /statistics

spring:
  data:
    mongodb:
      host: ${MONGO_HOST:statistics-mongodb}
      port: 27017
      database: piggymetrics
      username: user
      password: ${MONGODB_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          statistics-service:
            client-id: statistics-service
            client-secret: ${STATISTICS_SERVICE_PASSWORD:}
            authorization-grant-type: client_credentials
            scope: server
            provider: piggymetrics
        provider:
          piggymetrics:
            token-uri: http://auth-service:5000/uaa/oauth2/token
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:5000/uaa

rates:
  url: https://api.exchangeratesapi.io

feign:
  sentinel:
    enabled: true

# ---- marker proving this config is served by Nacos (unique top-level key) ----
nacosConfigMarker:
  source: nacos
