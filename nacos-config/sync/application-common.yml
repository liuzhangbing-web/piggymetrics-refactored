# group: PIGGYMETRICS  dataId: application-common.yml
# Shared config for all piggymetrics services (Nacos-managed).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  zipkin:
    tracing:
      # 联调: Jaeger Zipkin 兼容端口; 生产 SkyWalking 见接入指南(建议 javaagent)
      endpoint: ${ZIPKIN_ENDPOINT:http://jaeger:9414/api/v2/spans}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
logging:
  level:
    org.springframework.security: INFO

# ---- marker proving this config is served by Nacos (unique top-level key) ----
nacosConfigMarker:
  source: nacos
